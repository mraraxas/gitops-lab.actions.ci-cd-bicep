name: CI-CD

on:
  push:
      branches:
        - main
      paths-ignore:
        -README.md
  pull_request:
     branches: [ main ]
  workflow_dispatch:

env: 
  AZURE_RG: RG3
  AZURE_SUB: bac81dbc-00c9-4a7a-a1c9-60fd45e8b158
  AZURE_LOCATION: WestEurope

jobs: 
  Build-Job:
    runs-on: ubuntu-latest
    env:
       configuration: release

    steps:
    - name: Checkout Sources
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v2.0.0
      with:
        dotnet-version: 10.0.x
    - name: Restore Dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration ${{env.configuration}}
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration ${{env.configuration}}
    - name: Publish
      run: dotnet publish --configuration ${{env.configuration}} --output ${{runner.temp}}/publish

    - name: Upload the publish artifact
      uses: action/upload-artifact@v4
      with:
        name: publish_artifact
        path: ${{runner.temp}}/publish
        retention-days: 30
    - name: upload a templates artifact
      uses: actions/upload-artifact@v4
      with:
        name: templates_artifact
        path: ./templates/*
        retention-days: 30

  RG-Job:
    runs-on: ubuntu-latest
    needs: Build-Job

    steps:
     - name: Login to Azure
       uses: azure/login@v2
       with:
         creds: ${{secrets.AZURE_CREDS}}
     - name: Create Resource Group
       uses: Azure/cli@v2
       with:
         InlineScript:
           az group create --name ${{env.AZURE_RG}} --location ${{env.AZURE_LOCATION}}

  WebApp-Job:
    runs-on: ubuntu-latest
    needs: RG-Job

    env:
      AZURE-WEBAPP-NAME: we-prd-wa-u2u-mywebapp

    steps:
      - name: Download Templates
        uses: actions/download-artifact@v4
        with:
          name: templates_artifact
          path: ${{runner.temp}}/templates
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{secrets.AZURE_CREDS}}
      - name: Deploy BICEP template
        uses: azure/arm-deploy@v2
        id: deploywebapp
        with:
          deploymentName: create-webapp
          subscriptionId: ${{env.AZURE_SUB}}
          resourceGroupName: ${{env.AZURE_RG}}
          template: ${{runner.temp}}/templates/webapp.bicep
          parameters: location=${{env.AZURE_LOCATION}} appname=${{env.AZURE-WEBAPP-NAME}}

      - name: Download Publish
        uses: actions/download-artifact@v4
        with:
          name: publish_artifact
          path: ${{runner.temp}}/publish

      - name: Azure WebApp
        uses: Azure/webapps-deploy@v2
        with:
          app-name: ${{steps.deploywebapp.outputs.webappname}}
          # app-name: {{env.AZURE-WEBAPP-NAME}}
          package: ${{runner.temp}}/publish
    
